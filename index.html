<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGWEB DEV - Hollow Knight Master Modder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Hollow Knight Master Modder</h1>
            <p class="brand">Desenvolvido por <a href="https://github.com/DGWEB-SCRIPTS" target="_blank">DGWEB DEV</a></p>
        </header>
        
        <section class="upload-section">
            <label for="fileInput" class="custom-file-upload">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Selecionar Save (user1.dat)
            </label>
            <input type="file" id="fileInput" accept=".dat" />
            <p id="status">Aguardando importação do arquivo...</p>
        </section>

        <div id="editorBox" class="hidden">
            <!-- AÇÕES RÁPIDAS (PRESETS) -->
            <div class="panel">
                <h3>⚡ Ações Rápidas</h3>
                <div class="grid-botoes">
                    <button class="btn-preset" id="btnAmuletos">📿 Todos os Amuletos</button>
                    <button class="btn-preset" id="btnHabilidades">✨ Todas Habilidades</button>
                    <button class="btn-preset" id="btnHitKill">🗡️ Golpe Fatal</button>
                    <button class="btn-preset" id="btnVida">❤️ Vida Máxima</button>
                    <button class="btn-preset" id="btnDinheiro">💰 Geo Infinito</button>
                </div>
            </div>

            <!-- BOTÃO TOGGLE -->
            <button id="btnToggleAdvanced" class="btn-outline">⚙️ Configuração Completa</button>

            <!-- MODO AVANÇADO -->
            <div id="advancedEditor" class="hidden panel no-padding">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="tab-recursos">Atributos & Ferrão</button>
                    <button class="tab-btn" data-tab="tab-inventario">Inventário</button>
                    <button class="tab-btn" data-tab="tab-habilidades">Habilidades</button>
                    <button class="tab-btn" data-tab="tab-amuletos">Amuletos</button>
                    <button class="tab-btn" data-tab="tab-historia">História</button>
                    <button class="tab-btn" data-tab="tab-mundo">Mundo</button>
                </div>

                <!-- ABA: ATRIBUTOS E FERRÃO -->
                <div class="tab-content active" id="tab-recursos">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>💰 Geo (Dinheiro)</label>
                            <input type="number" id="inpGeo" min="0">
                        </div>
                        <div class="input-group">
                            <label>❤️ Vida Máxima</label>
                            <input type="number" id="inpVida" min="1">
                        </div>
                        <div class="input-group">
                            <label>🗡️ Dano do Ferrão</label>
                            <input type="number" id="inpDano" min="1">
                        </div>
                        <div class="input-group">
                            <label>🗡️ Nível do Ferrão</label>
                            <select id="selNailLevel" data-key="nailSmithUpgrades">
                                <option value="0">Ferrão Velho (Nível 0)</option>
                                <option value="1">Ferrão Afiado (Nível 1)</option>
                                <option value="2">Ferrão Canalizado (Nível 2)</option>
                                <option value="3">Ferrão Espiral (Nível 3)</option>
                                <option value="4">Ferrão Puro (Nível 4)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>📿 Espaços de Amuletos</label>
                            <input type="number" id="inpCharmSlots" min="1" max="11">
                        </div>
                    </div>
                </div>

                <!-- ABA: INVENTÁRIO -->
                <div class="tab-content" id="tab-inventario">
                    <div class="form-grid">
                        <div class="input-group"><label>👻 Essência (Sonhos)</label><input type="number" id="inpEssencia" min="0"></div>
                        <div class="input-group"><label>⛏️ Minério Pálido</label><input type="number" id="inpOre" min="0"></div>
                        <div class="input-group"><label>🗝️ Chaves Simples</label><input type="number" id="inpKeys" min="0"></div>
                        <div class="input-group"><label>🥚 Ovos Rançosos</label><input type="number" id="inpEggs" min="0"></div>
                        <div class="input-group"><label>🐛 Larvas Resgatadas</label><input type="number" id="inpGrubs" min="0" max="46"></div>
                        <div class="input-group"><label>⏳ Tempo de Jogo (Segundos)</label><input type="number" id="inpPlayTime" min="0"></div>
                    </div>
                </div>

                <div class="tab-content" id="tab-habilidades"><div class="skills-grid" id="skillsContainer"></div></div>
                <div class="tab-content" id="tab-amuletos">
                    <input type="text" id="searchAmuletos" class="search-bar" placeholder="🔍 Pesquisar amuleto...">
                    <div class="charms-grid" id="charmsContainer"></div>
                </div>
                <div class="tab-content" id="tab-historia"><div class="skills-grid" id="storyContainer"></div></div>
                <div class="tab-content" id="tab-mundo"><div class="skills-grid" id="worldContainer"></div></div>
            </div>

            <!-- DOWNLOADS -->
            <div class="download-section">
                <button class="btn-down text" id="btnDownTexto">📄 Baixar .TXT</button>
                <button class="btn-down crypt" id="btnDownJogo">💾 Exportar para o Jogo (.DAT)</button>
            </div>
        </div>
        
        <footer>
            &copy; 2026 DGWEB DEV. Todos os direitos reservados.
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
